<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 轻卡原型 v0</title>
  <style>
    :root {
      --paper: #f6f3ed;
      --paper-soft: #fffdfa;
      --ink: #1d1a16;
      --muted: #756f66;
      --line: rgba(29, 26, 22, 0.11);
      --blue: #193f91;
      --green: #2f6f57;
      --rose: #b95445;
      --gold: #c8a04b;
      --shadow: 0 18px 48px rgba(28, 22, 15, 0.09);
      --radius: 19px;
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(246, 243, 237, 0) 34%),
        #f6f3ed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .phone-page {
      min-height: 100vh;
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 10px 15px 30px;
    }

    .actionbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 -15px;
      padding: 10px 15px 8px;
      background: rgba(246, 243, 237, 0.90);
      backdrop-filter: blur(14px);
    }

    .soft-button {
      min-height: 40px;
      border: 1px solid rgba(29, 26, 22, 0.12);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 253, 250, 0.66);
      font-size: 13px;
      font-weight: 780;
    }

    .soft-button.primary {
      color: var(--ink);
      background: rgba(255, 253, 250, 0.88);
      border-color: rgba(25, 63, 145, 0.28);
      box-shadow: inset 0 0 0 1px rgba(25, 63, 145, 0.05);
    }

    .section {
      margin-top: 14px;
    }

    .section.is-hidden {
      display: none;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 3px 10px;
    }

    .section-title {
      margin: 0;
      color: #5a5148;
      font-size: 12px;
      font-weight: 820;
      letter-spacing: 0.04em;
    }

    .section:not(#review-section) > .section-head {
      display: none;
    }

    .section-note {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    #term-count {
      display: none;
    }

    #event-count {
      display: none;
    }

    .card-list {
      display: grid;
      gap: 14px;
    }

    .light-card {
      border: 1px solid rgba(29, 26, 22, 0.10);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(255, 253, 250, 0.88);
      box-shadow: var(--shadow);
    }

    .light-card > summary {
      position: relative;
      min-height: 190px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
      padding: 22px 19px 18px;
      cursor: pointer;
      list-style: none;
    }

    .card-list .light-card:first-child > summary {
      min-height: 210px;
    }

    .light-card > summary::-webkit-details-marker {
      display: none;
    }

    .card-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--rose);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.02em;
    }

    .card-title {
      display: block;
      color: var(--ink);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: 29px;
      font-weight: 760;
      line-height: 1.08;
      overflow-wrap: anywhere;
    }

    .card-teaser {
      display: grid;
      gap: 7px;
      margin-top: 15px;
      color: #5d5245;
      font-size: 15px;
      font-weight: 420;
      line-height: 1.66;
    }

    .teaser-main,
    .teaser-detail {
      display: block;
    }

    .teaser-main {
      color: #42382d;
      font-weight: 620;
    }

    .teaser-detail {
      color: #746d63;
      font-size: 14px;
      line-height: 1.62;
    }

    .open-dot {
      position: relative;
      width: 44px;
      height: 38px;
      display: block;
      border-radius: 15px;
      color: #b95f38;
      background: rgba(185, 95, 56, 0.08);
      transition: transform 180ms ease, background 180ms ease;
    }

    .open-dot::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 18px;
      width: 17px;
      height: 15px;
      border-radius: 12px 12px 9px 9px;
      background: #c86d42;
      box-shadow: inset 0 -3px 0 rgba(94, 48, 30, 0.13);
      transform: rotate(-6deg);
    }

    .open-dot::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 10px;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #f8dfc7;
      box-shadow: 9px -3px 0 #f8dfc7, 18px 0 0 #f8dfc7;
    }

    details[open] .open-dot {
      background: rgba(185, 95, 56, 0.14);
      color: #9e4f30;
    }

    .card-body {
      display: grid;
      gap: 14px;
      padding: 0 19px 19px;
      color: #4e4538;
      font-size: 14px;
      line-height: 1.64;
    }

    .card-body p {
      margin: 0;
    }

    .back-block {
      display: grid;
      gap: 8px;
      border-top: 1px solid rgba(33, 29, 24, 0.10);
      padding-top: 14px;
    }

    .back-block p {
      margin: 0;
    }

    .back-label {
      color: #a84d41;
      font-size: 12px;
      font-weight: 820;
      line-height: 1.25;
    }

    .back-text {
      color: #2f2a24;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.76;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .learn-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid rgba(33, 29, 24, 0.10);
      padding-top: 14px;
    }

    .learn-button {
      order: 2;
      width: 48px;
      height: 44px;
      flex: 0 0 auto;
      position: relative;
      display: block;
      border: 1px solid rgba(185, 95, 56, 0.20);
      border-radius: 14px;
      color: #9e4f30;
      background: linear-gradient(180deg, rgba(255, 246, 235, 0.96), rgba(185, 95, 56, 0.10));
      box-shadow: 0 8px 18px rgba(185, 95, 56, 0.08);
    }

    .learn-button::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 17px;
      z-index: 1;
      width: 28px;
      height: 20px;
      border-radius: 15px 15px 11px 11px;
      background: #c86d42;
      box-shadow: inset 0 -3px 0 rgba(94, 48, 30, 0.15);
      transform: rotate(-6deg);
    }

    .learn-button::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 9px;
      z-index: 1;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #d9753f;
      box-shadow: 11px -3px 0 #d9753f, 22px 0 0 #d9753f;
    }

    .learn-yes {
      position: absolute;
      left: 50%;
      top: 23px;
      z-index: 2;
      transform: translateX(-50%) rotate(-6deg);
      color: #fff8ee;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(94, 48, 30, 0.16);
      pointer-events: none;
    }

    .learn-button.is-done {
      border-color: rgba(37, 98, 74, 0.18);
      color: var(--green);
      background: linear-gradient(180deg, rgba(247, 252, 248, 0.96), rgba(37, 98, 74, 0.10));
      box-shadow: 0 8px 18px rgba(37, 98, 74, 0.08);
    }

    .learn-button.is-done::before,
    .learn-button.is-done::after {
      background: var(--green);
      box-shadow: inset 0 -3px 0 rgba(24, 70, 52, 0.12);
    }

    .learn-button.is-done::after {
      box-shadow: 9px -3px 0 var(--green), 18px 0 0 var(--green);
    }

    .learn-copy {
      order: 1;
      display: grid;
      gap: 2px;
      flex: 1;
      color: #332d24;
      font-size: 13px;
      line-height: 1.45;
    }

    .learn-copy strong {
      color: #242019;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .learn-copy strong.is-soft {
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .learn-copy span {
      color: var(--muted);
      font-size: 12px;
    }

    .learn-plus {
      margin-left: 4px;
      color: #b95f38;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 820;
      letter-spacing: 0.02em;
      vertical-align: -2px;
    }

    .chip {
      border: 1px solid rgba(33, 29, 24, 0.12);
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--muted);
      background: rgba(255, 250, 240, 0.72);
      font-size: 11px;
      text-decoration: none;
    }

    .related-more {
      border-top: 1px solid rgba(33, 29, 24, 0.08);
      padding-top: 11px;
    }

    .related-more summary {
      display: inline-flex;
      min-height: auto;
      padding: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 780;
      line-height: 1.4;
      list-style: none;
    }

    .related-more summary:focus {
      outline: 0;
    }

    .related-more summary::-webkit-details-marker {
      display: none;
    }

    .related-more summary::after {
      content: "⌄";
      margin-left: 5px;
      color: rgba(118, 108, 94, 0.74);
    }

    .related-more[open] summary::after {
      content: "⌃";
    }

    .related-more .chips {
      margin-top: 9px;
    }

    .year-pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      border: 1px solid rgba(33, 29, 24, 0.16);
      padding: 4px 9px;
      color: #6f6253;
      background: rgba(255, 250, 240, 0.72);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.02em;
    }

    .timeline-card .card-kicker {
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .timeline-card .card-title {
      margin-top: 0;
      padding-right: 0;
    }

    .timeline-card .card-teaser {
      margin-top: 18px;
    }

    .loading {
      padding: 18px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .footer-space {
      height: 18px;
    }

    .learn-toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      min-width: 172px;
      max-width: min(320px, calc(100vw - 36px));
      transform: translate(-50%, 18px);
      border: 1px solid rgba(33, 29, 24, 0.13);
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--paper-soft);
      background: rgba(33, 29, 24, 0.92);
      box-shadow: var(--shadow);
      font-size: 13px;
      font-weight: 760;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .learn-toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .win-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(246, 243, 237, 0.74);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .win-layer.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .win-card {
      width: min(100%, 360px);
      border: 1px solid rgba(29, 26, 22, 0.11);
      border-radius: 24px;
      padding: 24px 20px 18px;
      background: rgba(255, 253, 250, 0.94);
      box-shadow: 0 24px 70px rgba(28, 22, 15, 0.16);
      text-align: center;
      transform: translateY(10px) scale(0.98);
      transition: transform 240ms ease;
    }

    .win-layer.is-visible .win-card {
      transform: translateY(0) scale(1);
    }

    .win-mascot {
      width: 112px;
      height: 112px;
      margin: -4px auto 6px;
      display: block;
      object-fit: contain;
    }

    .win-kicker {
      margin: 0 0 5px;
      color: #b95f38;
      font-size: 12px;
      font-weight: 840;
      letter-spacing: 0.08em;
    }

    .win-title {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: 30px;
      line-height: 1.12;
    }

    .win-copy {
      margin: 10px auto 0;
      max-width: 280px;
      color: #5f574e;
      font-size: 14px;
      line-height: 1.65;
    }

    .win-list {
      display: grid;
      gap: 7px;
      margin: 15px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    .win-list li {
      border: 1px solid rgba(29, 26, 22, 0.08);
      border-radius: 13px;
      padding: 9px 10px;
      color: #373029;
      background: rgba(246, 243, 237, 0.58);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.38;
    }

    .win-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }

    .win-button {
      min-height: 40px;
      border: 1px solid rgba(29, 26, 22, 0.13);
      border-radius: 14px;
      color: var(--ink);
      background: rgba(255, 253, 250, 0.74);
      font-size: 13px;
      font-weight: 820;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .win-button.primary {
      color: var(--paper-soft);
      border-color: #b95f38;
      background: #b95f38;
    }

    .record-entry {
      position: fixed;
      right: 14px;
      bottom: 16px;
      z-index: 18;
      width: 52px;
      height: 46px;
      display: grid;
      gap: 1px;
      place-items: center;
      border: 1px solid rgba(33, 29, 24, 0.14);
      border-radius: 15px;
      color: var(--blue);
      background: rgba(255, 250, 240, 0.88);
      box-shadow: 0 10px 24px rgba(41, 33, 24, 0.10);
      font-weight: 860;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .record-entry strong {
      display: block;
      font-size: 16px;
      line-height: 1;
    }

    .record-entry span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1;
    }

    @media (min-width: 720px) {
      body {
        background:
          radial-gradient(circle at 14% 0%, rgba(216, 166, 50, 0.20), transparent 30%),
          linear-gradient(90deg, #eee7d9 0%, #fbf7ee 18%, #fbf7ee 82%, #eee7d9 100%);
      }

      .phone-page {
        padding-top: 12px;
      }

      .light-card {
        border-radius: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="phone-page">
    <div class="actionbar" aria-label="切换卡片">
      <button class="soft-button primary" id="next-event" type="button">换一段历史</button>
      <button class="soft-button" id="next-term" type="button">换一个词</button>
    </div>

    <section class="section is-hidden" id="review-section" aria-label="到期回看">
      <div class="section-head">
        <h2 class="section-title">该回看</h2>
        <span class="section-note" id="review-count">0 张</span>
      </div>
      <div class="card-list" id="review-list"></div>
    </section>

    <section class="section" aria-label="时间轴轻卡">
      <div class="section-head">
        <h2 class="section-title">时间轴</h2>
        <span class="section-note" id="event-count">读取中</span>
      </div>
      <div class="card-list" id="event-list">
        <div class="light-card loading">正在装载时间轴卡片。</div>
      </div>
    </section>

    <section class="section" aria-label="词典轻卡">
      <div class="section-head">
        <h2 class="section-title">词卡</h2>
        <span class="section-note" id="term-count">读取中</span>
      </div>
      <div class="card-list" id="term-list">
        <div class="light-card loading">正在装载词典卡片。</div>
      </div>
    </section>

    <div class="footer-space"></div>
  </main>
  <a class="record-entry" href="ai-learning-record.html" aria-label="查看学习记录">
    <strong id="record-count">0</strong>
    <span>记录</span>
  </a>
  <div class="learn-toast" id="learn-toast" role="status" aria-live="polite"></div>
  <div class="win-layer" id="win-layer" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <section class="win-card">
      <img class="win-mascot" src="assets/red-panda-mascot-soft-popup-512.png?v=20260609-soft" alt="" aria-hidden="true">
      <p class="win-kicker" id="win-kicker">今日完成</p>
      <h2 class="win-title" id="win-title">今天很可以</h2>
      <p class="win-copy" id="win-copy">你刚刚点亮了一张 AI 卡。</p>
      <ul class="win-list" id="win-list"></ul>
      <div class="win-actions">
        <a class="win-button" href="ai-learning-record.html">看记录</a>
        <button class="win-button primary" id="win-close" type="button">继续学习</button>
      </div>
    </section>
  </div>

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function shortText(value, limit = 92) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= limit) return text;
      return `${text.slice(0, limit - 1)}…`;
    }

    function slug(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9\u4e00-\u9fa5_-]/g, "")
        .slice(0, 64);
    }

    function splitReadable(value, limit = 86) {
      const blocks = String(value || "")
        .split(/\n+/)
        .map(item => item.trim())
        .filter(Boolean);
      const pieces = [];
      blocks.forEach(block => {
        const sentences = block
          .split(/(?<=[。！？；])/)
          .map(item => item.trim())
          .filter(Boolean);
        let current = "";
        sentences.forEach(sentence => {
          if ((current + sentence).length > limit && current) {
            pieces.push(current);
            current = sentence;
          } else {
            current += sentence;
          }
        });
        if (current) pieces.push(current);
      });
      return pieces.slice(0, 5);
    }

    function firstReadable(value, limit = 76) {
      const first = splitReadable(value, limit)[0] || String(value || "").trim();
      return shortText(first, limit);
    }

    function readableAt(value, index = 0, limit = 76) {
      const pieces = splitReadable(value, limit);
      return shortText(pieces[index] || pieces[0] || value || "", limit);
    }

    function cleanLead(value) {
      return String(value || "")
        .replace(/^为何重要[:：]\s*/, "")
        .replace(/^背后现场[:：]\s*/, "")
        .replace(/^这件事的背景是[:：]\s*/, "")
        .trim();
    }

    function frontLine(primary, fallback, limit = 84) {
      return shortText(cleanLead(firstReadable(primary, limit) || firstReadable(fallback, limit)), limit);
    }

    function isThinLine(text, title = "") {
      const value = cleanLead(text);
      if (!value) return true;
      const titleCore = String(title).replace(/[|｜].*$/, "").trim();
      const genericWords = ["展示显著突破", "取得突破性表现", "成为", "推动", "显示潜力"];
      if (titleCore && value.includes(titleCore) && genericWords.some(word => value.includes(word))) return true;
      return value.length < 18;
    }

    function concreteLineFromEvent(event, limit = 78) {
      const candidates = splitReadable(`${event.summary}\n${event.why}`, 92)
        .map(cleanLead)
        .filter(item => !isThinLine(item, event.title));
      return shortText(candidates[0] || eventDetails[event.title] || event.why || event.summary, limit);
    }

    function teaserHTML(main, detail = "") {
      const safeMain = escapeHTML(shortText(main, 88));

      return `<span class="card-teaser"><span class="teaser-main">${safeMain}</span>${safeDetail}</span>`;
    }

    function dailyOffset(total, step, salt) {
      if (!total) return 0;
      const day = Math.floor(Date.now() / 86400000);
      const maxStart = Math.max(1, total - step);
      return (day * salt) % maxStart;
    }

    function todayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function dayNumber(dateKeyValue) {
      return Math.floor(new Date(`${dateKeyValue}T00:00:00`).getTime() / 86400000);

    function readLearned() {
      try {
        const raw = JSON.parse(localStorage.getItem(learnedStorageKey) || "{}");
        Object.keys(raw).forEach(date => {
          if (!Array.isArray(raw[date])) {
            raw[date] = [];
            return;
          }
          raw[date] = raw[date].map(item => {
            if (typeof item === "string") {
              return { id: item, title: item, type: "记录", learnedAt: "" };
            }
            return item;
          });
        });
        return raw;
      } catch (error) {
        return {};
      }
    }

    function learnedIdSet() {
      const ids = new Set();
      Object.values(readLearned()).forEach(items => {
        if (!Array.isArray(items)) return;
        items.forEach(item => {
          if (item?.id) ids.add(item.id);
        });
      });
      return ids;
    }

    function newItems(items) {
      const learned = learnedIdSet();
      const fresh = items.filter(item => !learned.has(item.id));
      return fresh.length ? fresh : items;
    }

    function sliceLoop(items, offset, size) {
      if (!items.length) return [];
      return Array.from({ length: Math.min(size, items.length) }, (_, index) => {
        return items[(offset + index) % items.length];
      });
    }

    function listWithPinned(items, pinnedId, offset, size) {
      const pool = newItems(items);
      const pinned = items.find(item => item.id === pinnedId);
      if (!pinned) return sliceLoop(pool, offset, size);
      const rest = pool.filter(item => item.id !== pinned.id);
      return [pinned, ...sliceLoop(rest, offset, size - 1)].slice(0, size);
    }

    function writeLearned(value) {
      localStorage.setItem(learnedStorageKey, JSON.stringify(value));
    }

    function updateRecordEntry() {
      const count = readLearned()[todayKey()]?.length || 0;
      const node = document.getElementById("record-count");
      if (node) node.textContent = count;

      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 1700);
    }

    function showWinMoment(todayItems) {
      const count = todayItems.length;
      if (count !== 1 && count % 3 !== 0) return;

      const layer = document.getElementById("win-layer");
      const title = document.getElementById("win-title");
      const copy = document.getElementById("win-copy");
      const list = document.getElementById("win-list");
      if (!layer || !title || !copy || !list) return;

      title.textContent = count === 1 ? "第一张已点亮" : `${count} 张轻卡完成`;
      copy.textContent = count === 1
        ? "今天已经开始对 AI 多了解一点。"
        : `你对 AI 世界的了解又多了 ${count} 个点。`;
      list.innerHTML = todayItems.slice(-3).map(item =>
        `<li>${escapeHTML(item.title || item.id)}</li>`
      ).join("");
      window.setTimeout(() => layer.classList.add("is-visible"), 120);
    }

    function closeWinMoment() {
      document.getElementById("win-layer")?.classList.remove("is-visible");
    }

      });

        const strong = action?.querySelector(".learn-copy strong");
        const note = action?.querySelector(".learn-copy span");
        if (strong) strong.textContent = "今天多懂了一点";
        if (strong) strong.classList.add("is-soft");
        if (note) note.textContent = "已经记进今天的学习记录。";
      });
    }

    function renderBackBlock(label, value, limit = 86, maxPieces = 1) {
      const pieces = splitReadable(value, limit).slice(0, maxPieces);
      if (!pieces.length) return "";
      return `
        <section class="back-block">
          <span class="back-label">${escapeHTML(label)}</span>
          ${pieces.map(text => `<p class="back-text">${escapeHTML(cleanLead(text))}</p>`).join("")}
        </section>
      `;
    }

    async function loadJSON(path) {
      const separator = path.includes("?") ? "&" : "?";
      const response = await fetch(`${path}${separator}v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`${path} failed`);
      return response.json();
    }

    function normalizeTerm(term) {
      return {
        term: term.term || "",
        termZh: term.term_zh || "",
        category: term.category || "AI 词条",
        id: `term-${slug(term.id || term.term || term.term_zh)}`,
        short: term.definition_short || term.front || "",
        why: term.why_it_matters || "",
        example: term.example || (Array.isArray(term.examples) ? term.examples[0] : "") || "",
        hook: term.memory_hook || term.back || "",
        related: Array.isArray(term.related_terms) ? term.related_terms.slice(0, 4) : []
      };
    }

    function openingTermRank(term) {
      if (quietOpeningTermIds.has(term.id)) return 900;
      const names = [term.term, term.termZh, displayTermTitle(term)].map(normalizeSearchName);
      const featuredIndex = openingTermOrder.findIndex(name => names.includes(normalizeSearchName(name)));
      if (featuredIndex >= 0) return featuredIndex;
      if (names.some(name => quietOpeningTerms.has(name))) return 900;
      if (calmCategories.has(term.category)) return 500;
      return 700;
    }

    function isQuietOpeningEvent(event) {
      const text = `${event.title} ${event.date} ${event.summary} ${event.why}`;
      return quietOpeningEventPatterns.some(pattern => pattern.test(text));
    }

    function openingEventRank(event) {
      const featuredIndex = openingEventOrder.findIndex(title => normalizeSearchName(title) === normalizeSearchName(event.title));
      if (featuredIndex >= 0) return featuredIndex;
      if (isQuietOpeningEvent(event)) return 900;
      if (/^202[0-9]/.test(String(event.date || ""))) return 500;
      return 750;
    }

    function sortByOpeningRank(items, ranker) {
      return items
        .map((item, index) => ({ item, index, rank: ranker(item) }))
        .sort((a, b) => a.rank - b.rank || a.index - b.index)
        .map(entry => entry.item);
    }

    function isQuietReviewCard(card) {
      if (!card) return true;
      if (card.kind === "term") return openingTermRank(card.value) >= 900;
      if (card.kind === "event") return openingEventRank(card.value) >= 900;
      return false;
    }

    function normalizeEvent(event) {
      const title = event.title_zh || event.title_en || "AI 事件";
      return {
        year: event.year || event.date || "",
        date: event.date || event.year || "",
        title,
        id: `event-${slug(`${event.date || event.year || ""}-${title}`)}`,
        summary: event.summary_zh || "",
        why: event.why_it_matters_zh || "",
        hook: eventHooks[title] || "",
        detail: eventDetails[title] || "",
        related: Array.isArray(event.related_terms) ? event.related_terms.slice(0, 4) : []
      };
    }

    function pickTerms(terms) {
      return sortByOpeningRank(terms.filter(term => term.short), openingTermRank);
    }

    function displayTermTitle(term) {
      const primary = String(term.term || "").trim();
      const secondary = String(term.termZh || "").trim();
      if (!secondary) return primary;
      if (normalizeSearchName(primary) === normalizeSearchName(secondary)) return primary;
      return `${primary}｜${secondary}`;
    }

    function openingTermTeaser(term) {
      const key = Object.keys(openingTermTeasers).find(name => normalizeSearchName(name) === normalizeSearchName(term.term));
      return key ? openingTermTeasers[key] : "";
    }

    function renderTermCard(term, index) {
      const title = displayTermTitle(term);
      const teaser = openingTermTeaser(term) || frontLine(term.short, term.hook || term.why, 84);
      return `
        <details class="light-card" data-card-id="${escapeHTML(term.id)}" data-card-title="${escapeHTML(title)}" data-card-type="词卡">
          <summary>
            <span>
              <span class="card-kicker">${escapeHTML(term.category)}</span>
              <span class="card-title">${escapeHTML(title)}</span>
              ${teaserHTML(teaser)}
            </span>
            <span class="open-dot" aria-hidden="true"></span>
          </summary>
          <div class="card-body">
            ${renderBackBlock("一句话", term.short, 78)}
            ${renderBackBlock("为何重要", term.why, 88, 2)}
            ${renderBackBlock("记住", term.hook, 78)}
            ${renderBackBlock("例子", term.example, 82)}
            ${renderLearnAction(term.id)}
            ${renderChips(freshRelatedTerms(term.related).slice(0, 3))}
          </div>
        </details>
      `;
    }

    function renderEventCard(event, index) {
      const teaser = event.hook || concreteLineFromEvent(event, 84);
      const scene = eventScenes[event.title] || readableAt(event.summary, 1, 92);
      return `
        <details class="light-card timeline-card" data-card-id="${escapeHTML(event.id)}" data-card-title="${escapeHTML(event.title)}" data-card-type="历史">
          <summary>
            <span>
              <span class="card-kicker"><span class="year-pill">${escapeHTML(event.date)}</span></span>
              <span class="card-title">${escapeHTML(event.title)}</span>
              ${teaserHTML(teaser)}
            </span>
            <span class="open-dot" aria-hidden="true"></span>
          </summary>
          <div class="card-body">
            ${renderBackBlock("背后现场", scene, 56, 3)}
            ${renderBackBlock("为何重要", event.why, 86, 2)}
            ${renderLearnAction(event.id)}
            ${renderChips(freshRelatedTerms(event.related).slice(0, 3))}
          </div>
        </details>
      `;
    }

    function hasLearned(cardId) {
      const learned = readLearned();
      const todayItems = Array.isArray(learned[todayKey()]) ? learned[todayKey()] : [];
      return todayItems.some(item => item.id === cardId);
    }

    function renderLearnAction(cardId) {
      const done = hasLearned(cardId);
      const buttonClass = done ? "learn-button is-done" : "learn-button";
      const title = done ? "今天多懂了一点" : "今天";
      const note = done ? "已经记进今天的学习记录。" : "懂了，就点一下小熊猫的 YES。";
      const titleHTML = done
        ? escapeHTML(title)
        : `${escapeHTML(title)}<span class="learn-plus">+1</span>`;
      return `
        <div class="learn-action">
          <button class="${buttonClass}" type="button" data-learn-id="${escapeHTML(cardId)}" aria-label="${escapeHTML(title)}"><span class="learn-yes">YES</span></button>
          <span class="learn-copy">
            <strong class="${done ? "is-soft" : ""}">${titleHTML}</strong>
            <span>${escapeHTML(note)}</span>
          </span>
        </div>
      `;
    }

    function renderChips(items) {
      if (!items.length) return "";
      return `
        <details class="related-more">
          <summary>顺着看 ${items.length} 个</summary>
          <div class="chips">${items.map(item =>
            `<button class="chip" type="button" data-related-term="${escapeHTML(item)}">${escapeHTML(item)}</button>`
          ).join("")}</div>
        </details>
      `;
    }

    function findTermByName(name) {
      const wanted = normalizeSearchName(name);
      return state.terms.find(term =>
        normalizeSearchName(term.term) === wanted ||
        normalizeSearchName(term.termZh) === wanted ||
        normalizeSearchName(`${term.term}｜${term.termZh}`) === wanted
      );
    }

    function freshRelatedTerms(items) {
      const learned = learnedIdSet();
      return items.filter(item => {
        const term = findTermByName(item);
        return !term || !learned.has(term.id);
      });
    }

    function normalizeSearchName(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function openRelatedTerm(name) {
      const match = findTermByName(name);
      if (!match) {
        showToast("这张词卡还没放进轻卡流");
        return;
      }
      state.termPinnedId = match.id;
      state.termOffset = state.terms.findIndex(term => term.id === match.id);
      renderTerms();
      document.querySelector('[aria-label="词典轻卡"]')?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderTerms() {
      const pool = newItems(state.terms);
      if (state.termOffset >= pool.length) state.termOffset = 0;
      const list = listWithPinned(state.terms, state.termPinnedId, state.termOffset, 3);
      document.getElementById("term-list").innerHTML = list.map(renderTermCard).join("");
      document.getElementById("term-count").textContent = pool.length === state.terms.length
        ? `${state.terms.length} 张`
        : `${pool.length} 张新卡`;
    }

    function renderEvents() {
      const pool = newItems(state.events);
      if (state.eventOffset >= pool.length) state.eventOffset = 0;
      const list = listWithPinned(state.events, state.eventPinnedId, state.eventOffset, 3);
      document.getElementById("event-list").innerHTML = list.map(renderEventCard).join("");
      document.getElementById("event-count").textContent = pool.length === state.events.length
        ? `${state.events.length} 段`
        : `${pool.length} 段新历史`;
    }

    function dueReviewItems() {
      const learned = readLearned();
      const latest = new Map();
      Object.entries(learned).forEach(([date, items]) => {
        items.forEach(item => {
          const existing = latest.get(item.id);
          if (!existing || dayNumber(date) > dayNumber(existing.date)) {
            latest.set(item.id, { ...item, date });
          }
        });
      });

      const today = dayNumber(todayKey());
      const cards = new Map();
      state.events.forEach(event => cards.set(event.id, { kind: "event", value: event }));
      state.terms.forEach(term => cards.set(term.id, { kind: "term", value: term }));

      return [...latest.values()]
        .filter(item => {
          const gap = today - dayNumber(item.date);
          return reviewIntervals.has(gap);
        })
        .map(item => cards.get(item.id))
        .filter(Boolean)
        .filter(item => !isQuietReviewCard(item))
        .slice(0, 3);
    }

    function renderReviews() {
      const section = document.getElementById("review-section");
      const list = document.getElementById("review-list");
      const count = document.getElementById("review-count");
      const due = dueReviewItems();
      if (!due.length) {
        section.classList.add("is-hidden");
        list.innerHTML = "";
        count.textContent = "0 张";
        return;
      }
      section.classList.remove("is-hidden");
      count.textContent = `${due.length} 张`;
      list.innerHTML = due.map(item =>
        item.kind === "event" ? renderEventCard(item.value) : renderTermCard(item.value)
      ).join("");
    }

    function advanceTerms() {
      const pool = newItems(state.terms);
      if (!pool.length) return;
      state.termPinnedId = "";
      state.termOffset = (state.termOffset + 3) % pool.length;
      renderTerms();
      document.querySelector('[aria-label="词典轻卡"]')?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function advanceEvents() {
      const pool = newItems(state.events);
      if (!pool.length) return;
      state.eventPinnedId = "";
      state.eventOffset = (state.eventOffset + 3) % pool.length;
      renderEvents();
      document.querySelector('[aria-label="时间轴轻卡"]')?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function init() {
      try {
        const [dictionary, timeline] = await Promise.all([
          loadJSON("ai-dictionary.json"),
          loadJSON("ai-timeline-data.json")
        ]);
        state.terms = pickTerms((dictionary.terms || []).map(normalizeTerm));
        state.events = sortByOpeningRank((timeline.timeline || []).map(normalizeEvent), openingEventRank);
        state.eventOffset = 0;
        state.termOffset = 0;
        renderTerms();
        renderEvents();
        renderReviews();
        updateRecordEntry();
      } catch (error) {
        document.getElementById("term-list").innerHTML = `<div class="light-card loading">数据读取失败，请检查 JSON 文件。</div>`;
        document.getElementById("event-list").innerHTML = `<div class="light-card loading">数据读取失败，请检查 JSON 文件。</div>`;
      }
    }

    document.getElementById("next-term").addEventListener("click", advanceTerms);
    document.getElementById("next-event").addEventListener("click", advanceEvents);
    document.getElementById("win-close").addEventListener("click", closeWinMoment);
    document.getElementById("win-layer").addEventListener("click", event => {
      if (event.target.id === "win-layer") closeWinMoment();
    });
    document.addEventListener("click", event => {
      const related = event.target.closest("[data-related-term]");
      if (related) {
        openRelatedTerm(related.dataset.relatedTerm);
        return;
      }
      const button = event.target.closest("[data-learn-id]");
      if (!button) return;
      const card = button.closest("details");
      markLearned(button.dataset.learnId, card?.dataset.cardTitle, card?.dataset.cardType);
    });
    init();
  </script>
</body>
</html>
